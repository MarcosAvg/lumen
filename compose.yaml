name: lumen

# Lumen: app + PostgreSQL + migraciones. Publica la app en 127.0.0.1:${APP_PORT:-8090};
# el proxy inverso lo gestionas tú (ver `docs/deployment.md`).

# Rotación de logs común.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# URL interna de PostgreSQL (red de Compose).
x-database-url: &database-url postgres://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD:-lumen}@db:5432/${POSTGRES_DB:-lumen}

# Entorno común de `app` y `migrate`.
x-app-environment: &app-environment
  DATABASE_URL: *database-url
  PHOTO_STORAGE_PATH: /data/photos
  # Límite del cuerpo HTTP de adapter-node; debe superar MAX_UPLOAD_BYTES.
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-30M}
  PROTOCOL_HEADER: x-forwarded-proto
  ADDRESS_HEADER: x-forwarded-for
  XFF_DEPTH: '1'
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2560}
  IMAGE_THUMB_DIMENSION: ${IMAGE_THUMB_DIMENSION:-400}
  TZ: ${TZ:-UTC}
  # Web Push opcional: sin claves, la bandeja interna sigue funcionando.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

services:
  # PostgreSQL. No se publica: solo la red interna de Compose.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen}
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
    volumes:
      - postgres_data:/var/lib/postgresql/data # datos SQL
    healthcheck:
      # `$$` evita la interpolación de Compose (lo evalúa la shell del contenedor).
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1g}
          cpus: ${DB_CPUS:-2}

  # Aplica las migraciones una vez y termina; `app` espera a que complete.
  migrate:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    environment:
      DATABASE_URL: *database-url
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Se publica solo en 127.0.0.1. `image` + `build`: `pull` usa GHCR, `--build` compila.
  app:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    stop_grace_period: 15s
    environment: *app-environment
    volumes:
      - lumen_photos:/data/photos # fotos normalizadas y miniaturas
    ports:
      - '127.0.0.1:${APP_PORT:-8090}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 200 solo si la base responde y las migraciones están aplicadas.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}
          cpus: ${APP_CPUS:-2}

  # Proxy opcional (perfil `caddy`); usa `deploy/Caddyfile` y `DOMAIN`.
  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256m}
          cpus: ${CADDY_CPUS:-1}

# Persisten con `down`; `down -v` los borra (pierde datos).
volumes:
  postgres_data: # base de datos SQL
  lumen_photos: # fotografías y miniaturas
  caddy_data: # certificados TLS y cuentas ACME (perfil caddy)
  caddy_config: # configuración autoguardada de Caddy (perfil caddy)
