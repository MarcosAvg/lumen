name: lumen

# Lumen · autoalojamiento con `docker compose`.
#
# Servicios:
#   - `db`      PostgreSQL 17 con volumen persistente (no publicado al exterior).
#   - `migrate` aplica las migraciones de Drizzle una vez y termina.
#   - `app`     Lumen, publicado en `127.0.0.1:${APP_PORT:-8090}`.
#   - `caddy`   proxy opcional (perfil `caddy`) con HTTPS automático.
#
# El proxy inverso lo gestionas **tú** (Nginx, Traefik, Caddy…): termina TLS y
# reenvía a `127.0.0.1:${APP_PORT}` enviando siempre estas cabeceras (la app las
# exige para el origen y la IP real):
#     Host, X-Forwarded-Proto, X-Forwarded-For
# Sin `X-Forwarded-Proto` la app asume `https` (login por HTTP → 403); sin
# `X-Forwarded-For` el rate limiting puede fallar (500). Ver `docs/deployment.md`.
#
# Cómo usarlo:
#   docker compose pull && docker compose up -d          # imagen GHCR (por defecto)
#   docker compose up -d --build                          # compila en local
#   docker compose --profile caddy up -d                  # proxy Caddy con HTTPS automático
#   docker compose -f compose.yaml -f compose.dev.yaml up -d db   # solo PostgreSQL (dev)
#
# `.env` es opcional (defaults razonables); `install.sh` genera uno con secretos.

# --- Extensión: rotación de logs ------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# --- Extensión: URL interna de PostgreSQL ---------------------------------------
x-database-url: &database-url postgres://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD:-lumen}@db:5432/${POSTGRES_DB:-lumen}

# --- Extensión: entorno común de la app -----------------------------------------
# El origen público se deriva de la petición (no se hornea en la imagen). El proxy
# debe añadir `X-Forwarded-Proto`/`X-Forwarded-For`, que la app exige.
x-app-environment: &app-environment
  DATABASE_URL: *database-url
  PHOTO_STORAGE_PATH: /data/photos
  # Límite del cuerpo HTTP de adapter-node; debe superar MAX_UPLOAD_BYTES.
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-30M}
  PROTOCOL_HEADER: x-forwarded-proto
  ADDRESS_HEADER: x-forwarded-for
  XFF_DEPTH: '1'
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2560}
  IMAGE_THUMB_DIMENSION: ${IMAGE_THUMB_DIMENSION:-400}
  TZ: ${TZ:-UTC}
  # Web Push es opcional: sin estas claves, la bandeja interna sigue funcionando.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

services:
  # Base de datos. No se publica: solo la alcanzan `migrate` y `app` por la red
  # interna de Compose. Para desarrollo en el host, usa `compose.dev.yaml`.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen}
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
    volumes:
      # Datos SQL. Respalda este volumen junto con `lumen_photos` (ver deploy/backup.sh).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapa la interpolación de Compose para que la evalúe la shell del contenedor.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1g}
          cpus: ${DB_CPUS:-2}

  # Servicio efímero: aplica las migraciones y termina. `app` espera a que complete.
  migrate:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    environment:
      DATABASE_URL: *database-url
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # Sin límites de recursos: es un proceso corto que termina tras migrar.

  # Aplicación. Se publica SOLO en 127.0.0.1 (tu proxy reenvía ahí).
  # Con `image` + `build`: `docker compose pull` usa GHCR y `--build` compila en local.
  app:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    stop_grace_period: 15s
    environment: *app-environment
    volumes:
      # Fotografías normalizadas y miniaturas. Respalda junto con `postgres_data`.
      - lumen_photos:/data/photos
    ports:
      - '127.0.0.1:${APP_PORT:-8090}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # `/health` responde 200 solo si la base responde y las migraciones están aplicadas.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}
          cpus: ${APP_CPUS:-2}

  # Proxy opcional (perfil `caddy`). Úsalo si NO tienes ya un proxy inverso:
  #   docker compose --profile caddy up -d
  # `DOMAIN` es una dirección de sitio de Caddy: `http://localhost` (HTTP) o un
  # dominio (HTTPS con Let's Encrypt). Requiere `deploy/Caddyfile`.
  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256m}
          cpus: ${CADDY_CPUS:-1}

# Volúmenes persistentes. `down` los conserva; `down -v` los borra (pierde datos).
volumes:
  postgres_data: # base de datos SQL
  lumen_photos: # fotografías y miniaturas
  caddy_data: # certificados TLS y cuentas ACME (solo con el perfil caddy)
  caddy_config: # configuración autoguardada de Caddy (solo con el perfil caddy)
