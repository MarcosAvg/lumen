name: lumen

# Autoalojamiento en un solo `docker compose up -d`:
#   - `db`      PostgreSQL con volumen persistente (no publicado al exterior).
#   - `migrate` aplica migraciones una vez y termina.
#   - `app`     Lumen (imagen GHCR por defecto; ver `compose.build.yaml`).
#   - `caddy`   proxy de entrada: sirve http://localhost y, con `DOMAIN`, HTTPS
#               automático (Let's Encrypt). La app no se publica directamente.
#
# Todos los valores tienen un default razonable; `.env` es opcional para una
# prueba local y recomendable en producción (ver `install.sh` y `.env.example`).

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Variables comunes de la aplicación. El origen público se deriva de la petición
# (no se hornea en la imagen), así que no hay que reconstruir al cambiar de dominio.
# Caddy es el único ingreso y añade siempre `X-Forwarded-Proto`/`X-Forwarded-For`.
x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD:-lumen}@db:5432/${POSTGRES_DB:-lumen}
  PHOTO_STORAGE_PATH: /data/photos
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-30M}
  PROTOCOL_HEADER: x-forwarded-proto
  ADDRESS_HEADER: x-forwarded-for
  XFF_DEPTH: '1'
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2560}
  IMAGE_THUMB_DIMENSION: ${IMAGE_THUMB_DIMENSION:-400}
  TZ: ${TZ:-UTC}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen}
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL no se publica al exterior. Para desarrollo, usa `compose.dev.yaml`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1g}
          cpus: ${DB_CPUS:-2}

  # Servicio de un solo uso: aplica migraciones antes de arrancar la app.
  migrate:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD:-lumen}@db:5432/${POSTGRES_DB:-lumen}
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    restart: unless-stopped
    init: true
    environment: *app-environment
    volumes:
      - lumen_photos:/data/photos
    # Sin `ports`: el único ingreso es Caddy (red interna).
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}
          cpus: ${APP_CPUS:-2}

  # Proxy de entrada con HTTPS automático.
  #   DOMAIN=http://localhost  (por defecto) → sirve HTTP en el puerto 80.
  #   DOMAIN=lumen.midominio.com            → HTTPS con Let's Encrypt en 80/443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256m}
          cpus: ${CADDY_CPUS:-1}

volumes:
  postgres_data:
  lumen_photos:
  caddy_data:
  caddy_config:
