name: lumen

# Lumen: app + PostgreSQL + migraciones. La app se alcanza en la red externa
# `proxy` como `lumen:3000` (Cloudflare Tunnel / NPM en Docker).

# Rotación de logs común.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# URL interna de PostgreSQL (red de Compose).
x-database-url: &database-url postgres://lumen:${POSTGRES_PASSWORD}@db:5432/lumen

services:
  # PostgreSQL. No se publica: solo la red interna de Compose.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: lumen
    volumes:
      - postgres_data:/var/lib/postgresql/data # datos SQL
    healthcheck:
      # `$$` evita la interpolación de Compose (lo evalúa la shell del contenedor).
      test: ['CMD-SHELL', 'pg_isready -U lumen -d lumen']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  # Aplica las migraciones una vez y termina; `app` espera a que complete.
  migrate:
    image: ghcr.io/marcosavg/lumen:${LUMEN_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    environment:
      DATABASE_URL: *database-url
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Se alcanza en la red `proxy` como `lumen:3000`. `image` + `build`:
  # `pull` usa GHCR y `--build` compila en local.
  app:
    image: ghcr.io/marcosavg/lumen:${LUMEN_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    stop_grace_period: 15s
    environment:
      DATABASE_URL: *database-url
      PHOTO_STORAGE_PATH: /data/photos
      # Límite del cuerpo HTTP de adapter-node; debe superar MAX_UPLOAD_BYTES.
      BODY_SIZE_LIMIT: 30M
      # Cloudflare entrega estas cabeceras a través del túnel.
      PROTOCOL_HEADER: x-forwarded-proto
      ADDRESS_HEADER: cf-connecting-ip
      TZ: ${TZ:-UTC}
      # Web Push es parte del núcleo; `install.sh` genera las claves.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - lumen_photos:/data/photos # fotos normalizadas y miniaturas
    networks:
      default:
      proxy:
        aliases:
          - lumen
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 200 solo si la base responde y las migraciones están aplicadas.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

volumes:
  postgres_data: # base de datos SQL
  lumen_photos: # fotografías y miniaturas

networks:
  default:
  # Red compartida con cloudflared/NPM (Docker). La app se alcanza como `lumen:3000`.
  proxy:
    external: true
