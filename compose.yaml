name: lumen

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Publicado solo en localhost, para permitir `pnpm dev` desde el host.
    # No exponer PostgreSQL a Internet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Servicio de un solo uso: aplica migraciones antes de arrancar la app.
  migrate:
    image: lumen-app:local
    build:
      context: .
      target: runtime
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy

  app:
    image: lumen-app:local
    build:
      context: .
      target: runtime
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    init: true
    environment:
      # La URL interna se construye contra el host `db`, ignorando el `.env` de desarrollo.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PHOTO_STORAGE_PATH: /data/photos
      # adapter-node limita el body a 512K por defecto; las subidas necesitan más.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-30M}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2560}
      IMAGE_THUMB_DIMENSION: ${IMAGE_THUMB_DIMENSION:-400}
      TZ: ${TZ:-UTC}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - lumen_photos:/data/photos
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  lumen_photos:
