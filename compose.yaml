name: lumen

# Lumen · autoalojamiento con tu propio proxy inverso.
#
# Servicios:
#   - `db`      PostgreSQL 17 con volumen persistente (no publicado al exterior).
#   - `migrate` aplica las migraciones de Drizzle una vez y termina.
#   - `app`     Lumen (imagen GHCR por defecto; ver `compose.build.yaml`), publicado
#               solo en `127.0.0.1:${APP_PORT:-3000}`.
#
# El proxy inverso (Nginx, Traefik, Caddy…) lo gestionas **tú**: termina TLS y
# reenvía a `127.0.0.1:3000`. Debe enviar siempre estas cabeceras (la app las exige
# para derivar el origen público y la IP real):
#     Host, X-Forwarded-Proto, X-Forwarded-For
# Sin `X-Forwarded-Proto` la app asume `https` (login por HTTP → 403); sin
# `X-Forwarded-For` el rate limiting puede fallar (500). Ver `docs/deployment.md`.
#
# Cómo usarlo:
#   docker compose up -d                    # app en http://127.0.0.1:3000 (tras el proxy)
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build   # build local
#   docker compose -f compose.yaml -f compose.dev.yaml up -d db          # solo PostgreSQL (dev)
#
# ¿Sin proxy? Hay Caddy incluido como añadido opcional (HTTPS automático):
#   docker compose -f compose.yaml -f compose.caddy.yaml up -d
#
# `.env` es opcional: el compose tiene defaults razonables y `install.sh` genera uno.

# --- Extensión: rotación de logs ------------------------------------------------
# Evita que los logs de los contenedores llenen el disco del servidor.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# --- Extensión: URL interna de PostgreSQL ---------------------------------------
# Se construye contra el host `db` (red interna), ignorando cualquier `DATABASE_URL`
# del `.env` pensada para desarrollo en el host. Se reutiliza en `migrate` y `app`.
x-database-url: &database-url postgres://${POSTGRES_USER:-lumen}:${POSTGRES_PASSWORD:-lumen}@db:5432/${POSTGRES_DB:-lumen}

# --- Extensión: entorno común de la app -----------------------------------------
# El origen público se deriva de la petición (no se hornea en la imagen), así que no
# hay que reconstruir al cambiar de dominio. Tu proxy es el único ingreso y debe añadir
# `X-Forwarded-Proto`/`X-Forwarded-For`, que la app exige para el origen y la IP real.
x-app-environment: &app-environment
  DATABASE_URL: *database-url
  PHOTO_STORAGE_PATH: /data/photos
  # Límite del cuerpo HTTP de adapter-node; debe superar MAX_UPLOAD_BYTES.
  BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-30M}
  PROTOCOL_HEADER: x-forwarded-proto
  ADDRESS_HEADER: x-forwarded-for
  XFF_DEPTH: '1'
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-2560}
  IMAGE_THUMB_DIMENSION: ${IMAGE_THUMB_DIMENSION:-400}
  TZ: ${TZ:-UTC}
  # Web Push es opcional: sin estas claves, la bandeja interna sigue funcionando.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

services:
  # Base de datos. NO se publica ningún puerto: solo la alcanzan `migrate` y `app`
  # por la red interna de Compose. Para desarrollo en el host, usa `compose.dev.yaml`.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen}
      POSTGRES_DB: ${POSTGRES_DB:-lumen}
    volumes:
      # Datos SQL. Respalda este volumen junto con `lumen_photos` (ver backup.sh).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapa la interpolación de Compose para que la evalúe la shell del contenedor.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1g}
          cpus: ${DB_CPUS:-2}

  # Servicio efímero: aplica las migraciones y termina. `app` espera a que complete
  # con éxito, de modo que nunca arranca contra un esquema desactualizado.
  migrate:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    environment:
      DATABASE_URL: *database-url
    command: ['node', 'scripts/migrate.mjs']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # Sin límites de recursos: es un proceso corto que termina tras migrar.

  # Aplicación. Se publica SOLO en 127.0.0.1 (tu proxy reenvía ahí, en el host). Corre
  # como usuario sin privilegios y con `init` para cerrar limpiamente ante señales.
  app:
    image: ${LUMEN_IMAGE:-ghcr.io/marcosavg/lumen}:${LUMEN_TAG:-latest}
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    stop_grace_period: 15s
    environment: *app-environment
    volumes:
      # Fotografías normalizadas y miniaturas. Respalda junto con `postgres_data`.
      - lumen_photos:/data/photos
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # `/health` responde 200 solo si la base responde y las migraciones están aplicadas.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}
          cpus: ${APP_CPUS:-2}

# Volúmenes persistentes. `down` los conserva; `down -v` los borra (pierde datos).
volumes:
  postgres_data: # base de datos SQL
  lumen_photos: # fotografías y miniaturas
