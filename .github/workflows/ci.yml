name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: cambia-esta-clave
          POSTGRES_DB: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lumen:cambia-esta-clave@127.0.0.1:5432/lumen
      TEST_DATABASE_URL: postgres://lumen:cambia-esta-clave@127.0.0.1:5432/lumen_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas E2E (escritorio y móvil)
        run: pnpm test:e2e
      - name: Subir informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Compose e imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis de los scripts
        run: bash -n install.sh deploy/backup.sh deploy/restore.sh
      - name: Validar compose (base y dev)
        env:
          POSTGRES_PASSWORD: ci
          PROXY_NETWORK: proxy
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q
      - name: Construir la imagen (runtime)
        run: docker build --target runtime -t lumen-ci .
