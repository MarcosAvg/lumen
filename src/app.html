<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Lumen" />
		<meta name="theme-color" content="#1e4b8d" />
		<script nonce="%sveltekit.nonce%">
			(() => {
				try {
					const stored = localStorage.getItem('mode-watcher-mode');
					const preference =
						stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
					const dark =
						preference === 'dark' ||
						(preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
					document
						.querySelector('meta[name="theme-color"]')
						?.setAttribute('content', dark ? '#0f172a' : '#1e4b8d');
				} catch {
					// Si localStorage no está disponible, se usa el modo del sistema.
				}
			})();
		</script>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
