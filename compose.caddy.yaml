# Añadido opcional: proxy Caddy con HTTPS automático (Let's Encrypt).
#
#   docker compose -f compose.yaml -f compose.caddy.yaml up -d
#
# Úsalo si **no** tienes ya un proxy inverso. Caddy pasa a ser el único ingreso
# (80/443) y reenvía a `app:3000` añadiendo `X-Forwarded-Proto`/`X-Forwarded-For`.
# `app` sigue publicado en `127.0.0.1:${APP_PORT}` para depuración; no molesta.
#
# `DOMAIN` es una dirección de sitio de Caddy:
#   - `http://localhost` (por defecto) → sirve HTTP en el puerto 80 (pruebas locales).
#   - Un dominio (p. ej. `lumen.midominio.com`) → HTTPS con Let's Encrypt en 80/443.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Estado de Caddy: certificados y configuración autoguardada.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256m}
          cpus: ${CADDY_CPUS:-1}

volumes:
  caddy_data: # certificados TLS y cuentas ACME
  caddy_config: # configuración autoguardada de Caddy
